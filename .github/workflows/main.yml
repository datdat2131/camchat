name: Build AstraxChatFilter

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Verify Java and Maven
        run: |
          java -version
          mvn -version

      - name: Build AstraxChatFilter
        run: mvn --batch-mode --no-transfer-progress clean package

      - name: Upload AstraxChatFilter JAR
        uses: actions/upload-artifact@v4
        with:
          name: AstraxChatFilter-JAR
          path: target/*.jar
          if-no-files-found: error
